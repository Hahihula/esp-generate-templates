required:
  - chip
options:
  # This board is ESP32-C6, so the chip group offers exactly that rather than
  # `!Include plugin:chip`, which would offer every chip esp-generate knows.
  - !Category
    name: chip
    display_name: Chip selection
    options:
      - !Option
        name: esp32c6
        display_name: ESP32-C6
        selection_group: chip

  - !Category
    name: module
    display_name: Module/Board selection
    help: Select your board so the generated code avoids GPIOs it reserves.
    options:
      - !Option
        name: esp32-c6-touch-lcd-1_47
        display_name: Waveshare ESP32-C6 Touch LCD 1.47
        selection_group: module
        compatible:
          chip:
            - esp32c6
        # To have the generator reserve this board's GPIOs, add the limitation
        # tags it uses, e.g. `sets: { remove_pins: [spi_flash] }`. Note that on
        # the ESP32-C6 those pins are only `Peripherals` fields from esp-hal
        # 1.1 onwards; this template pins `~1.0`.

  - !Option
    name: unstable-hal
    display_name: Enable unstable HAL features.
    help: "This configuration enables unstable esp-hal features.
      These come with no stability guarantees, and could be changed or removed at any time."

  - !Option
    name: alloc
    display_name: Enable allocations via the esp-alloc crate.
    help: esp-alloc comes with no stability guarantees at this time.

  - !Option
    name: wifi
    display_name: Enable Wi-Fi via the esp-radio crate.
    help: esp-radio comes with no stability guarantees at this time.
    requires:
      - alloc
      - unstable-hal
    compatible:
      chip:
        - esp32
        - esp32c2
        - esp32c3
        - esp32c6
        - esp32s2
        - esp32s3

  - !Option
    name: ble-bleps
    display_name: Enable BLE via the esp-radio crate (bleps).
    help: esp-radio comes with no stability guarantees at this time.
    selection_group: ble-lib
    requires:
      - alloc
      - unstable-hal
    compatible:
      chip:
        - esp32
        - esp32c2
        - esp32c3
        - esp32c6
        - esp32h2
        - esp32s3

  - !Option
    name: ble-trouble
    display_name: Enable BLE via the esp-radio crate (embassy-trouble).
    help: esp-radio comes with no stability guarantees at this time.
    selection_group: ble-lib
    requires:
      - alloc
      - unstable-hal
      - embassy
    compatible:
      chip:
        - esp32
        - esp32c2
        - esp32c3
        - esp32c6
        - esp32h2
        - esp32s3

  - !Option
    name: embassy
    display_name: Add embassy framework support.
    help: esp-rtos module responsible for embassy support comes with no stability guarantees at this time.
    selection_group: base-template
    requires:
      - unstable-hal

  - !Option
    name: stack-smashing-protection
    display_name: Enable stack smashing protection.
    requires_nightly: true
    help: Requires nightly Rust. Note that this option generates additional checks in most functions
      and will slow down your code.

  - !Option
    name: probe-rs
    requires_tools: [probe-rs]
    display_name: Use probe-rs to flash and monitor instead of espflash.
    help: probe-rs is a debugger that connects to the chips over JTAG. It can be used to flash and
      monitor, and it can also be used to interactively debug an application, or run tests on the
      hardware. Semihosting or RTT-based technologies like defmt-rtt require probe-rs.
    compatible:
      chip:
        - esp32c6
        - esp32h2
        - esp32s3

  - !Option
    name: probe-rs
    requires_tools: [probe-rs]
    display_name: Use probe-rs to flash and monitor instead of espflash.
    help: probe-rs is a debugger that connects to the chips over JTAG. It can be used to flash and
      monitor, and it can also be used to interactively debug an application, or run tests on the
      hardware. Semihosting or RTT-based technologies like defmt-rtt require probe-rs.

      probe-rs requires a debug probe like esp-prog, and will not work with USB-UART adapters that
      often come on development boards.
    compatible:
      chip:
        - esp32
        - esp32s2
        - esp32c2
        - esp32c3

  - !Category
    name: flashing-probe-rs
    display_name: Flashing, logging and debugging (probe-rs)
    requires:
      - probe-rs
    options:
      - !Option
        name: defmt
        display_name: Use defmt to print messages.
        selection_group: log-frontend
      - !Option
        name: panic-rtt-target
        display_name: Use panic-rtt-target as the panic handler.
        selection_group: panic-handler
        requires:
          - probe-rs
      - !Option
        name: embedded-test
        display_name: Enable embedded-test support.
        requires:
          - probe-rs

  - !Category
    name: flashing-espflash
    display_name: Flashing, logging and debugging (espflash)
    requires:
      - "!probe-rs"
    options:
      - !Option
        name: log
        display_name: Use the log crate to print messages.
        selection_group: log-frontend
        requires:
          - "!probe-rs"
      - !Option
        name: defmt
        display_name: Use defmt to print messages.
        selection_group: log-frontend
      - !Option
        name: esp-backtrace
        display_name: Use esp-backtrace as the panic handler.
        selection_group: panic-handler
        requires:
          - "!probe-rs"

  - !Category
    name: optional
    display_name: Options
    options:
      - !Option
        name: wokwi
        display_name: Add support for Wokwi simulation using VS Code Wokwi extension.
        compatible:
          chip:
            - esp32
            - esp32c3
            - esp32c6
            - esp32h2
            - esp32s2
            - esp32s3

      - !Option
        name: ci
        display_name: Add GitHub Actions support with some basic checks.

  - !Category
    name: esp32c6-peripherals
    display_name: ESP32-C6 Peripherals
    help: "ESP32-C6 specific peripheral options for the Touch LCD board."
    options:
      - !Option
        name: display
        display_name: Display (LCD) support.
        help: "Add support for the 172x320 RGB565 TFT LCD display using embedded-graphics. \
          Requires embassy for async time operations."
        requires:
          - embassy
        compatible:
          chip:
            - esp32c6

      - !Option
        name: touch
        display_name: Touch controller support.
        help: "Add support for the AXS5106L touch controller. Requires display option."
        requires:
          - embassy
          - display
        compatible:
          chip:
            - esp32c6

      - !Option
        name: imu
        display_name: IMU (QMI8658) sensor support.
        help: "Add support for the QMI8658 IMU sensor via I2C. Requires embassy."
        requires:
          - embassy
        compatible:
          chip:
            - esp32c6

      - !Option
        name: temp-sensor
        display_name: Temperature sensor support.
        help: "Add support for the ESP32-C6 built-in temperature sensor."
        compatible:
          chip:
            - esp32c6

      - !Option
        name: demo
        display_name: Demo application.
        help: "Add the demo application that showcases display, touch, IMU, and temperature \
          sensor features. Requires all peripheral options."
        requires:
          - display
          - touch
          - imu
          - temp-sensor
        compatible:
          chip:
            - esp32c6


  - !Category
    name: editor
    display_name: Optional editor integration
    options:
      - !Option
        name: helix
        display_name: Add settings for Helix Editor

      - !Option
        name: neovim
        display_name: Add settings for Neovim

      - !Option
        name: vscode
        display_name: Add settings for Visual Studio Code

      - !Option
        name: zed
        display_name: Add settings for Zed

  - !Category
    name: toolchain
    display_name: Rust toolchain
    options:
      - !Option
        name: ""
        display_name: "Scanning installed toolchains..."
        selection_group: toolchain
